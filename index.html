<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PRISMA カードコレクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 上質で清潔なデジタルカードゲーム。余白多め、カードが主役
   IDEA: プリズム（光の分光）。パックもレア演出も「光が割れて色になる」
   PICTURE: 大きなホロパック／カードそのもの
   COLOUR and TYPE: 白〜淡い虹色の地、インク#1d2335、アクセント#5a63ff。M PLUS Rounded + Outfit
   LAYOUT: 縦1カラム、スマホ幅基準（最大480px）、主要操作は下部 */
:root{color-scheme:light;--bg:#f3f5fb;--ink:#1d2335;--sub:#7d869c;--line:#e3e7f0;--ac:#5a63ff;--card-r:7%/5%;
--fontj:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;--fonte:"Outfit",var(--fontj)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e8ebf4;color:var(--ink);font:500 15px/1.5 var(--fontj);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:
 radial-gradient(120% 60% at 10% 0%,#e9e6ff 0,transparent 60%),radial-gradient(100% 50% at 100% 100%,#dff4ff 0,transparent 60%),var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- タイトル ---------- */
#title{align-items:center;justify-content:center;gap:0;overflow:hidden}
.floaters{position:absolute;inset:0;pointer-events:none}
.floaters .cb{position:absolute;width:90px;opacity:.55;filter:blur(.3px);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(var(--r0))}to{transform:translateY(-30vh) rotate(var(--r1))}}
.logo{position:relative;text-align:center;margin-top:-6vh}
.logo svg{width:110px;height:110px;filter:drop-shadow(0 14px 22px rgba(90,99,255,.35));animation:bob 4s ease-in-out infinite}
.logo h1{margin:6px 0 0;font:800 52px/1 var(--fonte);letter-spacing:.06em;background:linear-gradient(100deg,#5a63ff,#b05cff 35%,#ff7eb3 60%,#ffb35c 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:8px 0 0;color:var(--sub);font-weight:700;letter-spacing:.2em;font-size:13px}
.tbtns{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:56px;width:min(72%,280px)}
.btn{height:54px;border-radius:999px;font-weight:800;font-size:17px;letter-spacing:.06em;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{color:#fff;background:linear-gradient(100deg,#5a63ff,#9b5cff);box-shadow:0 12px 26px -10px rgba(90,99,255,.7)}
.btn.sec{background:#fff;box-shadow:0 0 0 1px var(--line),0 6px 16px -10px rgba(30,40,80,.3)}
.ver{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));color:#a3abbf;font-size:11px}

/* ---------- ホーム ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:60px}
.chip{height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.fast{background:#1d2335;color:#fff;box-shadow:none}
.homeMid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.packWrap{position:relative;animation:bob 4.2s ease-in-out infinite;cursor:pointer}
.packWrap::before{content:"";position:absolute;inset:-18% -30%;background:radial-gradient(closest-side,rgba(170,150,255,.45),transparent);z-index:-1;animation:pulse 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.pack{position:relative;width:min(60vw,240px);aspect-ratio:.64;border-radius:12px;overflow:hidden;
 background:linear-gradient(165deg,#c8d2ff 0%,#efe3ff 30%,#fff1df 55%,#d4f3ff 80%,#cbd0ff 100%);
 box-shadow:0 34px 50px -26px rgba(50,60,140,.6),inset 0 0 0 1.5px rgba(255,255,255,.8)}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:3;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 3px,rgba(120,120,200,.12) 3px 6px)}
.pack::before{top:0}.pack::after{bottom:0}
.pack .irid{position:absolute;inset:0;background:conic-gradient(from 200deg at 30% 40%,#ff9ad5,#9ab8ff,#9affe1,#fff19a,#ff9ad5);mix-blend-mode:soft-light;opacity:.8}
.pack .shine{position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-45%)}60%,100%{transform:translateX(45%)}}
.pack .pin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.pack .pin svg{width:46%;filter:drop-shadow(0 10px 14px rgba(70,60,180,.35))}
.pack .pin b{margin-top:10px;font:800 clamp(22px,7vw,30px)/1 var(--fonte);letter-spacing:.08em;color:#3d3f8f}
.pack .pin small{margin-top:6px;font:700 10px/1 var(--fonte);letter-spacing:.3em;color:#6d70b5}
.pack .pin i{position:absolute;bottom:28px;font-style:normal;font:700 10px/1 var(--fonte);letter-spacing:.2em;color:#6d70b5;background:rgba(255,255,255,.6);padding:5px 10px;border-radius:99px}
.tapHint{font:800 14px/1 var(--fonte);letter-spacing:.35em;color:#6a70c7;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.homeSub{font-size:12px;color:var(--sub);margin-top:-12px}
.homeBot{padding:12px 20px 22px;display:flex;justify-content:center}
.dexBtn{width:100%;max-width:340px;height:64px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line),0 12px 24px -16px rgba(30,40,80,.4);display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left}
.dexBtn:active{transform:scale(.97)}
.dexBtn .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5a63ff,#b05cff);display:grid;place-items:center}
.dexBtn .ic svg{width:22px;height:22px}
.dexBtn b{font-size:16px;display:block}
.dexBtn span{font-size:12px;color:var(--sub)}
.dexBtn .meter{margin-left:auto;width:70px;height:6px;border-radius:9px;background:#eceff6;overflow:hidden}
.dexBtn .meter div{height:100%;background:linear-gradient(90deg,#5a63ff,#ff7eb3)}

/* ---------- カード ---------- */
.card{position:relative;aspect-ratio:63/88;border-radius:var(--card-r);container-type:inline-size;transform-style:preserve-3d}
.card .fr{position:absolute;inset:0;border-radius:inherit;padding:5.5cqw;display:flex;flex-direction:column;gap:3cqw;overflow:hidden;
 box-shadow:0 1.5cqw 5cqw -1.5cqw rgba(20,25,60,.45),inset 0 0 0 .8cqw rgba(255,255,255,.55)}
.card .tp{display:flex;align-items:center;justify-content:space-between;gap:2cqw;height:10cqw}
.card .nm{font-weight:800;font-size:7.2cqw;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rb{flex:none;font:800 6cqw/1 var(--fonte);padding:1.6cqw 3cqw;border-radius:99px;background:rgba(255,255,255,.75);color:#555}
.card .art{position:relative;flex:1;border-radius:3.5cqw;overflow:hidden;background:#dde2ea;box-shadow:inset 0 0 0 .6cqw rgba(0,0,0,.06)}
.card .art svg,.card .art img{position:absolute;inset:0;width:100%;height:100%}.card .art img{object-fit:cover;display:block}
.card .bt{display:flex;justify-content:space-between;font:700 5.2cqw/1 var(--fonte);opacity:.75;height:7cqw;align-items:center}
.card .desc{font-size:5cqw;line-height:1.35;height:14cqw;overflow:hidden;opacity:.8}
.r-N .fr{background:linear-gradient(160deg,#f7f8fa,#dfe3ea)}
.r-R .fr{background:linear-gradient(160deg,#eef4ff,#a9c1f2)} .r-R .rb{color:#3f62c4}
.r-SR .fr{background:linear-gradient(160deg,#fff7dc,#e8bd5e)} .r-SR .rb{color:#a6741a}
.r-SSR .fr{background:linear-gradient(140deg,#ffd6ec,#d6e2ff 30%,#d2fff1 55%,#fff6c8 80%,#ffd6ec)} .r-SSR .rb{background:linear-gradient(90deg,#ff7eb3,#7e9bff,#62e3c0);color:#fff}
.r-UR .fr{background:linear-gradient(150deg,#2d2538,#0e0b14 60%,#2a2010);color:#f6e3b0;box-shadow:0 1.5cqw 6cqw -1cqw rgba(0,0,0,.6),inset 0 0 0 1cqw #c9a24a,inset 0 0 0 1.6cqw #3a2c12}
.r-UR .rb{background:linear-gradient(90deg,#f8e08e,#c9962e);color:#2a1d05}
.card .holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;background-size:300% 300%;animation:holo 5s ease-in-out infinite;background-position:var(--mx,50%) var(--my,50%)}
.r-SR .holo{background-image:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.9) 48%,transparent 60%);opacity:.45}
.r-SSR .holo{background-image:linear-gradient(115deg,transparent 20%,#ff9ad5 32%,#9ab8ff 42%,#9affe1 52%,#fff19a 62%,transparent 75%);opacity:.5}
.r-UR .holo{background-image:linear-gradient(115deg,transparent 25%,#ffe08a 38%,#ff9ad5 46%,#9ab8ff 54%,#ffe08a 62%,transparent 75%);opacity:.3}
.tilting .holo{animation:none}
@keyframes holo{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.card.locked .fr{background:linear-gradient(160deg,#eef0f4,#dde1e8)!important;color:#9aa2b3;box-shadow:inset 0 0 0 .8cqw rgba(255,255,255,.6)}
.card.locked .rb{background:#e6e9ef;color:#9aa2b3}
.card .new{position:absolute;top:15cqw;left:-3cqw;z-index:5;font:800 7cqw/1 var(--fonte);color:#fff;padding:2.6cqw 4cqw;border-radius:99px;background:linear-gradient(90deg,#ff5f8f,#ff9a4d);box-shadow:0 2cqw 4cqw -1cqw rgba(255,80,120,.6);letter-spacing:.06em}
.card .cnt{position:absolute;right:-2cqw;bottom:-3cqw;z-index:5;font:800 7.5cqw/1 var(--fonte);background:#1d2335;color:#fff;padding:2.4cqw 4cqw;border-radius:99px}
/* カード裏 */
.cback{position:absolute;inset:0;border-radius:var(--card-r);overflow:hidden;background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.25) 0 18%,transparent 19%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px),
 linear-gradient(160deg,#5a63ff,#3a2f8f 60%,#251b5c);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 10px 24px -10px rgba(0,0,0,.5);display:grid;place-items:center}
.cback svg{width:36%}

/* ---------- 図鑑 ---------- */
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.back{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line)}
.back svg{width:20px;height:20px}
.hd h2{margin:0;font-size:20px;font-weight:800}
.hd .tot{margin-left:auto;text-align:right;font:800 18px/1 var(--fonte)}
.hd .tot small{display:block;font:700 11px/1.4 var(--fontj);color:var(--sub)}
.stats{display:flex;gap:16px;padding:0 18px 10px;font-size:12px;color:var(--sub)}
.stats b{color:var(--ink);font-family:var(--fonte)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 12px 10px}
.tab{height:54px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab b{font:800 15px/1 var(--fonte)}
.tab span{font:600 11px/1 var(--fonte);color:var(--sub)}
.tab.on{color:#fff;box-shadow:none}
.tab.on span{color:rgba(255,255,255,.85)}
.tab.on[data-r=N]{background:#8a93a6}.tab.on[data-r=R]{background:#4f74d9}.tab.on[data-r=SR]{background:#d49a2b}
.tab.on[data-r=SSR]{background:linear-gradient(120deg,#ff7eb3,#7e9bff,#4fd6b2)}.tab.on[data-r=UR]{background:linear-gradient(120deg,#2d2538,#7a5a1c);color:#f8e08e}
.grid{flex:1;overflow-y:auto;padding:6px 16px 30px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;align-content:start;-webkit-overflow-scrolling:touch}
.grid .card{cursor:pointer;transition:transform .15s}
.grid .card:active{transform:scale(.95)}
.done{grid-column:1/-1;text-align:center;font-weight:800;color:#c9962e;padding:4px}

/* ---------- 詳細 ---------- */
#detail{align-items:center;overflow:hidden}
#detail .hd{align-self:stretch}
.dBg{position:absolute;inset:0;z-index:-1;transition:background .4s}
.dStage{flex:1;display:flex;align-items:center;justify-content:center;perspective:900px;width:100%}
.dStage .card{width:min(74vw,330px);transition:transform .25s ease-out}
.dStage .card .fr{box-shadow:0 30px 60px -24px rgba(20,25,60,.6),inset 0 0 0 .8cqw rgba(255,255,255,.55)}
.dInfo{display:flex;gap:10px;align-items:stretch;padding:8px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:420px}
.dInfo .box{flex:1;background:rgba(255,255,255,.85);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 1px var(--line)}
.dInfo .box small{display:block;color:var(--sub);font-size:11px;font-weight:700}
.dInfo .box b{font:800 20px/1.2 var(--fonte)}
.dInfo .box em{font-style:normal;font-size:12px;color:var(--sub)}
.share{flex:none;width:64px;border-radius:16px;background:linear-gradient(135deg,#5a63ff,#9b5cff);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800}
.share svg{width:22px;height:22px}

/* ---------- 開封オーバーレイ ---------- */
#open{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#2b3263,#10132a 70%)}
#open.on{display:block}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bgfx{position:absolute;inset:0;transition:opacity .5s;opacity:0}
.bg-ssr{opacity:1;background:conic-gradient(from 0deg,#ff7eb3,#ffd36e,#7effc8,#7ec8ff,#b07eff,#ff7eb3);filter:saturate(.9) brightness(.8)}
.bg-ssr::after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(20,15,50,.55))}
.bg-ur{opacity:1;background:radial-gradient(80% 60% at 50% 45%,#5a4214,#120c05 70%,#000)}
.rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:45%;margin:-80vmax 0 0 -80vmax;border-radius:50%;opacity:0;transition:opacity .4s;
 background:repeating-conic-gradient(rgba(255,255,255,.22) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 70%);mask:radial-gradient(closest-side,#000 20%,transparent 70%);animation:spin 16s linear infinite}
.rays.gold{background:repeating-conic-gradient(rgba(255,214,120,.38) 0 5deg,transparent 5deg 15deg)}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.oPack{transition:transform .3s}
.oPack.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.02)}75%{transform:rotate(3deg) scale(1.02)}}
.oPack.burst{animation:burst .45s ease-in forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}
.glow{position:absolute;width:120vmin;height:120vmin;border-radius:50%;background:radial-gradient(closest-side,var(--g,#fff),transparent);opacity:.0;transition:opacity .4s}
.glow.on{opacity:.75;animation:pulse 1s ease-in-out infinite}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.counter{position:absolute;top:calc(16px + env(safe-area-inset-top));left:18px;font:800 14px/1 var(--fonte);color:rgba(255,255,255,.7);letter-spacing:.1em;z-index:5}
.skip{position:absolute;top:calc(8px + env(safe-area-inset-top));right:12px;z-index:6;height:40px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font:800 13px/1 var(--fonte);letter-spacing:.15em;backdrop-filter:blur(6px)}
.revealSlot{position:relative;width:min(64vw,280px);perspective:1000px}
.flip{position:relative;width:100%;aspect-ratio:63/88;transform-style:preserve-3d}
.flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .card{transform:rotateY(180deg)}
.flip.in{animation:enter .28s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes enter{from{transform:translateY(40px) scale(.7);opacity:0}}
.flip.turn{transition:transform var(--ft,.35s) cubic-bezier(.3,.7,.2,1);transform:rotateY(180deg)}
.flip.r-glow-R .cback{box-shadow:0 0 30px 6px rgba(120,160,255,.9),inset 0 0 0 5px rgba(255,255,255,.4)}
.flip.r-glow-SR .cback{box-shadow:0 0 40px 10px rgba(255,205,100,.95),inset 0 0 0 5px rgba(255,240,200,.6)}
.flip.r-glow-SSR .cback{box-shadow:0 0 50px 14px rgba(255,140,220,.9),0 0 90px 20px rgba(120,200,255,.6),inset 0 0 0 5px #fff}
.flip.r-glow-UR .cback{box-shadow:0 0 60px 18px rgba(255,210,110,1),inset 0 0 0 5px #f8e08e}
.revName{position:absolute;left:0;right:0;bottom:calc(-58px);text-align:center;color:#fff;font-weight:800;font-size:17px;opacity:0;transition:opacity .3s;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.revName small{display:block;font:800 12px/1.6 var(--fonte);letter-spacing:.3em;opacity:.8}
.revName.on{opacity:1}
.pt{position:absolute;left:50%;top:45%;width:var(--s,8px);height:var(--s,8px);border-radius:50%;background:var(--c,#fff);box-shadow:0 0 10px var(--c,#fff);pointer-events:none;animation:fly var(--d,1s) ease-out forwards}
.pt.star{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.ring{position:absolute;left:50%;top:45%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:3px solid var(--c,#fff);animation:ring .7s ease-out forwards;pointer-events:none}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
/* UR専用 */
.urT{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:8}
.urT .dot{width:8px;height:8px;border-radius:50%;background:#fff6d0;box-shadow:0 0 30px 10px #ffd36e;animation:grow 1.3s cubic-bezier(.6,0,.4,1) forwards}
@keyframes grow{60%{transform:scale(6);box-shadow:0 0 60px 30px #ffd36e}100%{transform:scale(90);opacity:1}}
.urT h3{position:absolute;margin:0;font:800 clamp(34px,11vw,52px)/1 var(--fonte);letter-spacing:.12em;opacity:0;
 background:linear-gradient(100deg,#fff3c4,#e8b84a 40%,#fff 50%,#e8b84a 60%,#fff3c4);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:urTxt 1.6s 1.1s ease-out forwards, gshine 1.2s 1.1s linear infinite}
.urT p{position:absolute;margin:70px 0 0;color:#e8c46a;font:800 13px/1 var(--fonte);letter-spacing:.6em;opacity:0;animation:urTxt 1.4s 1.3s ease-out forwards}
@keyframes urTxt{0%{opacity:0;transform:scale(1.4);filter:blur(8px)}30%{opacity:1;transform:scale(1);filter:none}100%{opacity:1}}
@keyframes gshine{to{background-position:-200% 0}}
/* 結果 */
.results{flex-direction:column;gap:18px;padding:20px 14px}
.resTitle{color:#fff;font:800 16px/1 var(--fonte);letter-spacing:.25em;text-align:center}
.resTitle small{display:block;margin-top:8px;font:700 12px/1 var(--fontj);letter-spacing:.05em;color:rgba(255,255,255,.7)}
.resGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 8px;width:100%;max-width:450px}
.resGrid .card{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
.resGrid .card.hi::before{content:"";position:absolute;inset:-6%;border-radius:12%;z-index:-1;background:var(--hg);filter:blur(8px);opacity:.9;animation:pulse 1.6s ease-in-out infinite}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}}
.resBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-top:6px}
.rb2{height:52px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px;backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.rb2.pri{background:linear-gradient(100deg,#5a63ff,#9b5cff);box-shadow:0 10px 24px -10px rgba(90,99,255,.8)}

.resHint{color:rgba(255,255,255,.75);font:800 12px/1 var(--fonte);letter-spacing:.3em;animation:blink 1.6s infinite;margin-top:8px}

/* ---------- モーダル ---------- */
.modal{position:absolute;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(20,24,45,.45);backdrop-filter:blur(4px)}
.modal.on{display:flex;animation:fade .2s}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.5}}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:12px;background:#f1f3f8;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.row label span{font-family:var(--fonte);color:var(--sub)}
input[type=range]{width:100%;height:32px;accent-color:var(--ac)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f8;border-radius:14px;padding:4px;gap:4px}
.seg button{height:42px;border-radius:11px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.2)}
.tg{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:12px}
.tg small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.sw{flex:none;width:52px;height:32px;border-radius:99px;background:#d6dae4;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(20px)}
.rates{width:100%;border-collapse:collapse;font-size:13px}
.rates td{padding:6px 0;border-bottom:1px solid #f0f2f7}
.rates td:last-child,.rates td:nth-child(2){text-align:right;font-family:var(--fonte);white-space:nowrap}
.mv{width:100%;height:50px;border-radius:14px;background:#eef0ff;color:#4a52d8;font-weight:800;margin-bottom:10px}
.code{width:100%;min-height:96px;border-radius:14px;border:1px solid var(--line);background:#f7f8fc;padding:12px;font:600 13px/1.5 var(--fonte);color:var(--ink);word-break:break-all;resize:none;user-select:text;-webkit-user-select:text}
.code:focus{outline:3px solid #5a63ff;outline-offset:1px}
.mvRow{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.mvNote{font-size:12px;color:var(--sub);margin:6px 0 0}
.mvErr{font-size:13px;color:#d8344f;font-weight:700;min-height:1.4em;margin:6px 0 0}
.danger{width:100%;height:50px;border-radius:14px;background:#fff0f2;color:#d8344f;font-weight:800}
.dlg{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(20,24,45,.5);padding:24px}
.dlg.on{display:flex;animation:fade .2s}
.dlg .bx{width:100%;max-width:340px;background:#fff;border-radius:22px;padding:24px 20px 18px;text-align:center;animation:pop .25s}
.dlg h4{margin:0 0 8px;font-size:18px}

.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:99;background:#1d2335;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.packWrap,.pack .shine,.floaters .cb,.rays,.card .holo{animation:none!important}}
</style>

<body>

    <button class="share" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>共有</button>
  </div>

<!-- 開封 -->
<div id="open">

<!-- 設定 -->

  <div class="sheet">
    <h3>設定 <button class="x" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="row"><label>BGM音量 <span id="bgmV"></span></label><input type="range" id="bgm" min="0" max="100" step="1"></div>
    <div class="row"><label>SE音量 <span id="seV"></span></label><input type="range" id="se" min="0" max="100" step="1"></div>
    <div class="row"><label>開封演出</label><div class="seg" id="modeSeg"><button data-m="normal">通常開封</button><button data-m="fast">高速開封</button></div></div>
    <div class="row"><div class="tg"><div>高速開封でもUR演出を表示<small>URを引いたときだけ専用演出を流します</small></div><button class="sw" id="urSw" aria-label="UR演出"></button></div></div>
    <div class="row"><label>排出確率</label>
      <table class="rates"><tbody id="rateT"></tbody></table>
      <div style="font-size:12px;color:var(--sub);margin-top:6px">1枚ずつ独立抽選・確率固定・天井なし・確定枠なし・重複あり。同じレアリティ内は均等。</div>
    </div>
    <div class="row"><label>データ管理</label><button class="mv" id="moveBtn">データ移行（引き継ぎ）</button><button class="danger" id="resetBtn">データを初期化</button></div>

<!-- 共有 -->
<div class="modal" id="moveModal">
  <div class="sheet">
    <h3>データ移行 <button class="x" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="row" style="border-top:0;padding-top:0">
      <label>この端末のデータを引き継ぐ</label>
      <textarea class="code" id="outCode" readonly aria-label="引き継ぎコード"></textarea>

      <label>引き継ぎコードからデータを復元</label>

      <div class="mvRow"><button class="btn sec" id="loadCode">このコードで復元する</button></div>
      <p class="mvNote">復元すると、この端末のカードと開封記録は上書きされます。音量と演出の設定はこの端末のものを使います。</p>
    </div>

</div>

<div class="modal" id="shareModal">
  <div class="sheet">
    <h3>カード画像 <button class="x" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <img class="shareImg" id="shareImg" alt="共有用カード画像">

    <button class="btn pri" style="width:100%" id="shareNative">共有する</button>
  </div>
</div>

<div class="dlg" id="dlg"><div class="bx"><h4 id="dlgT"></h4><p id="dlgP"></p><div class="bb"><button id="dlgNo">キャンセル</button><button class="red" id="dlgYes"></button></div></div></div>
<div class="toast" id="toast"></div>
</div>

<script>
{
/* ================= データ定義 ================= */
const RAR=[
 {k:'N',count:100,w:7000,label:'NORMAL'},
 {k:'R',count:80,w:2000,label:'RARE'},
 {k:'SR',count:60,w:800,label:'SUPER RARE'},
 {k:'SSR',count:40,w:197,label:'SPECIAL SUPER RARE'},
 {k:'UR',count:15,w:3,label:'ULTRA RARE'}];
const RI={N:0,R:1,SR:2,SSR:3,UR:4};
const ELEM=[
 {k:'炎',h:10,ep:['ほのおの','火花の','紅蓮の','煉獄の','焔神']},
 {k:'水',h:205,ep:['みずの','さざなみの','蒼海の','深淵の','海神']},
 {k:'森',h:120,ep:['もりの','若葉の','翠緑の','古樹の','森神']},
 {k:'雷',h:48,ep:['いかずちの','稲妻の','雷鳴の','轟雷の','雷神']},
 {k:'氷',h:188,ep:['こおりの','霜の','氷晶の','絶氷の','氷神']},
 {k:'闇',h:275,ep:['やみの','宵の','月影の','冥府の','冥神']},
 {k:'光',h:40,ep:['ひかりの','陽だまりの','白光の','聖光の','光神']},
 {k:'風',h:155,ep:['かぜの','そよ風の','疾風の','天嵐の','風神']},
 {k:'岩',h:28,ep:['いわの','小石の','剛岩の','巨岩の','岩神']},
 {k:'星',h:245,ep:['ほしの','流れ星の','星屑の','銀河の','星神']}];
const CRE=[['キツネ','fox'],['ウサギ','bunny'],['フクロウ','wing'],['クジラ','fin'],['ドラゴン','horn'],['ネコ','fox'],['オオカミ','fox'],['カメ','none'],['ヘビ','none'],['シカ','antler'],
 ['クマ','round'],['タカ','wing'],['イルカ','fin'],['カエル','eyes'],['リス','round'],['ハリネズミ','spike'],['ペンギン','wing'],['ライオン','mane'],['トラ','round'],['ユニコーン','horn'],
 ['フェニックス','crest'],['ゴーレム','none'],['スライム','drop'],['ホタル','antenna'],['チョウ','antenna'],['クラゲ','drop'],['ヒツジ','curl'],['コウモリ','wing'],['パンダ','round'],['モモンガ','round']];

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CARDS=[];
(function build(){
  const rng=mulberry(20261121),pairs=[];
  for(let e=0;e<ELEM.length;e++)for(let c=0;c<CRE.length;c++)pairs.push([e,c]);
  for(let i=pairs.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]]}
  let id=1,p=0;
  RAR.forEach((r,ri)=>{for(let i=0;i<r.count;i++){const[e,c]=pairs[p++],code=r.k+String(i+1).padStart(3,'0');
    CARDS.push({id,code,file:`illust/${code}.webp`,no:code,rarity:r.k,ri,el:e,cr:c,seed:id*7919+13,
      name:ELEM[e].ep[ri]+CRE[c][0],desc:`${ELEM[e].k}の力を宿した${CRE[c][0]}。`});id++}});
})();
fetch('cards.json').then(r=>r.ok?r.json():null).then(list=>{if(!list)return;const by={};list.forEach(m=>by[m.id]=m);
  CARDS.forEach(c=>{const m=by[c.code];if(!m)return;if(m.name)c.name=m.name;if(m.theme)c.desc=m.theme;if(m.file)c.file=m.file})}).catch(()=>{});
const BY_R=RAR.map((_,ri)=>CARDS.filter(c=>c.ri===ri));

/* ================= 抽選 ================= */
function randInt(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=lim);return v%n}
function drawOne(){let x=randInt(10000),ri=0;for(;ri<RAR.length;ri++){if(x<RAR[ri].w)break;x-=RAR[ri].w}const pool=BY_R[ri];return pool[randInt(pool.length)]}

/* ================= 保存 ================= */
const KEY='prisma-collection-v1';
const DEF=()=>({v:1,cards:{},totalCards:0,totalPacks:0,bgm:60,se:80,mode:'normal',urFast:true});
let S=DEF();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)S=Object.assign(DEF(),s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const owned=id=>S.cards[id];
const ownedCount=ri=>BY_R[ri].filter(c=>S.cards[c.id]).length;
const ownedTotal=()=>Object.keys(S.cards).length;

function pull10(){
  const res=[];
  for(let i=0;i<10;i++){const c=drawOne();let o=S.cards[c.id];const isNew=!o;
    if(!o)o=S.cards[c.id]={n:0,first:Date.now()};o.n++;res.push({c,isNew})}
  S.totalCards+=10;S.totalPacks++;save();return res;
}

/* ================= イラスト生成（SVG） ================= */
const f=n=>n.toFixed(1);
function blob(rng,cx,cy,rx,ry,k,j){const P=[];for(let i=0;i<k;i++){const a=i/k*Math.PI*2-Math.PI/2,r=1-j+rng()*j*2;P.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}
  let d=`M${f(P[0][0])},${f(P[0][1])}`;for(let i=0;i<k;i++){const p0=P[(i-1+k)%k],p1=P[i],p2=P[(i+1)%k],p3=P[(i+2)%k];
  d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}return d+'Z'}
function mochi(cx,cy,rx,ry){const P=[[0,-1],[.7,-.7],[1,.04],[.73,.71],[0,1],[-.73,.71],[-1,.04],[-.7,-.7]].map(([x,y])=>[cx+x*rx,cy+y*ry]),k=P.length;
  let d=`M${f(P[0][0])},${f(P[0][1])}`;for(let i=0;i<k;i++){const p0=P[(i-1+k)%k],p1=P[i],p2=P[(i+1)%k],p3=P[(i+2)%k];
  d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}return d+'Z'}
function scallop(cx,cy,rx,ry,n,b){let d='';for(let i=0;i<=n;i++){const a=i/n*Math.PI*2-Math.PI/2,x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
  if(i===0){d=`M${f(x)},${f(y)}`;continue}const m=(i-.5)/n*Math.PI*2-Math.PI/2;d+=`Q${f(cx+Math.cos(m)*(rx+b*2))},${f(cy+Math.sin(m)*(ry+b*2))} ${f(x)},${f(y)}`}return d+'Z'}
const burn=(rng,k)=>{for(let i=0;i<k;i++)rng()};
function star4(x,y,s){return `M${f(x)},${f(y-s)}Q${f(x)},${f(y)} ${f(x+s)},${f(y)}Q${f(x)},${f(y)} ${f(x)},${f(y+s)}Q${f(x)},${f(y)} ${f(x-s)},${f(y)}Q${f(x)},${f(y)} ${f(x)},${f(y-s)}Z`}
const artCache={};
function artTpl(c,sil){
  const key=c.id+(sil?'s':'');if(artCache[key])return artCache[key];
  const rng=mulberry(c.seed),h=(ELEM[c.el].h+Math.floor(rng()*16)-8+360)%360,type=CRE[c.cr][1],ri=c.ri;
  const W=230,H=200,cx=115,cy=118,rx=50+rng()*14,ry=44+rng()*10,yT=cy-ry;
  const body=sil?'#aeb5c3':`url(#b§)`,stk=sil?'#aeb5c3':`hsl(${h},45%,${ri===4?30:38}%)`,acc=sil?'#aeb5c3':`hsl(${(h+30)%360},70%,${ri===4?60:55}%)`;
  let g='',bg='',deco='';
  // 背景
  if(sil){bg=`<rect x="-60" y="-60" width="350" height="380" fill="#e4e7ee"/><circle cx="${cx}" cy="95" r="80" fill="#eceef3"/>`}
  else if(ri===4){bg=`<radialGradient id="g§" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="hsl(${h},65%,46%)"/><stop offset=".45" stop-color="hsl(${h},55%,20%)"/><stop offset="1" stop-color="#040208"/></radialGradient><radialGradient id="ry§" gradientUnits="userSpaceOnUse" cx="${cx}" cy="95" r="240"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd36e" stop-opacity=".6"/><stop offset="1" stop-color="#ffb84d" stop-opacity=".08"/></radialGradient><rect x="-60" y="-60" width="350" height="380" fill="url(#g§)"/>`;

let busy=false,tapRes=null,skipping=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function waitTap(ms){return new Promise(r=>{let done=false;const fin=v=>{if(done)return;done=true;tapRes=null;clearTimeout(t);r(v)};const t=ms===Infinity?0:setTimeout(()=>fin(false),ms);tapRes=()=>fin(true)})}
$('open').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;tapRes&&tapRes()});
$('skipBtn').onclick=()=>{skipping=true;tapRes&&tapRes()};
const GLOW=['#ffffff','#9fc0ff','#ffd36e','#ff9ad5','#ffcf5a'];
function particles(n,colors,star,spread=1){const L=$('open');for(let i=0;i<n;i++){const p=document.createElement('div'),a=Math.random()*6.283,d=(120+Math.random()*240)*spread;
  p.className='pt'+(star&&Math.random()<.6?' star':'');p.style.cssText=`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--c:${colors[i%colors.length]};--s:${4+Math.random()*10}px;--d:${.7+Math.random()*.9}s`;L.appendChild(p);setTimeout(()=>p.remove(),1800)}}
function ring(c){const r=document.createElement('div');r.className='ring';r.style.setProperty('--c',c);$('open').appendChild(r);setTimeout(()=>r.remove(),800)}
function flash(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function setBg(ri){const b=$('bgfx'),r=$('rays');b.className='bgfx'+(ri===3?' bg-ssr':ri===4?' bg-ur':'');r.className='rays'+(ri>=3?' on':'')+(ri===4?' gold':'')}

async function urSequence(){
  const L=$('oLayer');const el=document.createElement('div');el.className='urT';el.innerHTML='<div class="dot"></div><h3>ULTRA RARE</h3><p>確定</p>';
  $('open').appendChild(el);AU.play('urIn');await waitTap(3000);flash();el.remove();
}
async function openPack(){
  if(busy)return;busy=true;skipping=false;
  const res=pull10();renderHome();
  const ready=Promise.race([Promise.all(res.map(r=>preload(r.c))),sleep(4000)]);
  const fast=S.mode==='fast',max=Math.max(...res.map(r=>r.c.ri)),hasUR=max===4;
  const O=$('open'),L=$('oLayer');O.classList.add('on');setBg(-1);$('counter').textContent='';$('skipBtn').style.display=fast?'none':'';
  // パック
  L.className='layer';L.innerHTML=`<div class="glow" id="glow" style="--g:${GLOW[Math.max(0,max-1)]}"></div><div class="oPack shake">${packHTML()}</div>`;
  AU.play('tap');
  if(!fast&&max>=2){await sleep(150);$('glow').classList.add('on')}
  await waitTap(fast?320:900);
  await ready;
  AU.play('tear');L.querySelector('.oPack').className='oPack burst';flash();await sleep(fast?200:420);
  const order=res.map((r,i)=>({...r,i}));
  let urShown=false;
  if(!fast){
    const DUR=[420,700,1100,1700,2400];
    for(let k=0;k<order.length&&!skipping;k++){
      const {c,isNew}=order[k];$('counter').textContent=`${k+1} / 10`;
      if(c.ri===4&&!urShown){await urSequence();urShown=true}
      setBg(c.ri>=3?c.ri:-1);
      L.innerHTML=`<div class="revealSlot"><div class="flip in r-glow-${c.rarity}" style="--ft:${c.ri>=2?.55:.3}s"><div class="cback">${PRISM}</div>${cardHTML(c,{isNew})}</div><div class="revName"><small>${RAR[c.ri].label}</small>${c.name}</div></div>`;
      const fl=L.querySelector('.flip');
      const hold=[90,220,420,620,500][c.ri];
      await waitTap(hold);if(skipping)break;
      AU.play('flip');fl.classList.add('turn');
      await sleep(c.ri>=2?260:140);
      AU.play(c.ri===4?'ur':'reveal',c.ri);L.querySelector('.revName').classList.add('on');
      if(c.ri===1){ring('#9fc0ff')}
      if(c.ri===2){ring('#ffd36e');particles(18,['#ffe08a','#fff','#ffc04d'],true,.8)}
      if(c.ri===3){flash();ring('#fff');particles(36,['#ff9ad5','#9ab8ff','#9affe1','#fff19a','#fff'],true,1.2)}
      if(c.ri===4){flash();ring('#ffd36e');particles(60,['#ffd36e','#fff4d0','#ffb84d','#fff'],true,1.5)}
      await sleep(Math.min(DUR[c.ri],450));if(skipping)break;
      const nh=document.createElement('div');nh.className='nextHint';nh.textContent=k<order.length-1?'タップで次のカードへ':'タップで結果へ';$('open').appendChild(nh);
      await waitTap(Infinity);nh.remove();
    }
  }
  if(hasUR&&!urShown&&(!fast||S.urFast)){$('counter').textContent='';$('skipBtn').style.display='none';await urSequence();urShown=true;
    const u=order.find(r=>r.c.ri===4).c;setBg(4);
    L.innerHTML=`<div class="revealSlot"><div class="flip in turn">${'<div class="cback"></div>'}${cardHTML(u,{isNew:res.find(r=>r.c===u).isNew})}</div><div class="revName on"><small>ULTRA RARE</small>${u.name}</div></div>`;
    AU.play('ur');particles(60,['#ffd36e','#fff4d0','#ffb84d','#fff'],true,1.5);await sleep(600);
    const nh=document.createElement('div');nh.className='nextHint';nh.textContent='タップで結果へ';$('open').appendChild(nh);await waitTap(Infinity);nh.remove()}
  // 結果
  setBg(-1);$('counter').textContent='';$('skipBtn').style.display='none';
  const nNew=res.filter(r=>r.isNew).length,HG=['','','#ffd36e','conic-gradient(#ff9ad5,#9ab8ff,#9affe1,#fff19a,#ff9ad5)','#ffcf5a'];
  L.className='layer results';
  L.innerHTML=`<div class="resTitle">RESULT<small>${nNew?`NEW ${nNew}枚`:'NEWなし'} · 図鑑 ${ownedTotal()} / ${CARDS.length}</small></div>
   <div class="resGrid">${order.map((r,k)=>cardHTML(r.c,{isNew:r.isNew,cls:r.c.ri>=2?'hi':'',style:`animation-delay:${k*45}ms;--hg:${HG[r.c.ri]}`})).join('')}</div>
   <div class="resBtns"><button class="rb2" id="homeBack">ホームにもどる</button><button class="rb2 pri" id="again">もう1回開封</button></div>`;
  AU.play('result');
  skipping=false;
  const choice=await new Promise(r=>{$('homeBack').onclick=()=>r('home');$('again').onclick=()=>r('again');setTimeout(()=>{tapRes=()=>r('home')},500)});
  tapRes=null;AU.play('tap');O.classList.remove('on');L.innerHTML='';busy=false;renderHome();
  if(choice==='again')openPack();
}

/* ================= 図鑑 ================= */
let tab=0;
function renderDex(){
  const n=ownedTotal();$('dexTot').innerHTML=`${n} / ${CARDS.length}<small>収集率 ${(n/CARDS.length*100).toFixed(1)}%</small>`;
  $('dexStats').innerHTML=`<span>累計開封 <b>${S.totalCards.toLocaleString()}</b> 枚</span><span>10連 <b>${S.totalPacks.toLocaleString()}</b> 回</span>`;
  $('tabs').innerHTML=RAR.map((r,i)=>`<button class="tab${i===tab?' on':''}" data-r="${r.k}" data-i="${i}"><b>${r.k}</b><span>${ownedCount(i)}/${r.count}</span></button>`).join('');
  const list=BY_R[tab],all=ownedCount(tab)===list.length;
  $('grid').innerHTML=(all?`<div class="done">★ ${RAR[tab].k} コンプリート！</div>`:'')+list.map(c=>{const o=owned(c.id);return cardHTML(c,{own:!!o,count:o?o.n:0,lazy:true})}).join('');
}
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;tab=+t.dataset.i;AU.play('tap');renderDex();$('grid').scrollTop=0});
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=+c.dataset.id;
  if(!owned(id)){toast('まだ入手していないカードです');return}AU.play('tap');openDetail(id)});

/* ================= 詳細 ================= */
let cur=null;
const DBG=['linear-gradient(#f3f5fa,#e2e6ee)','linear-gradient(#eef3ff,#c9d8fb)','linear-gradient(#fff9e6,#f1d79a)','linear-gradient(160deg,#ffe0f0,#e0e8ff 40%,#dcfff4 70%,#fff8d6)','radial-gradient(80% 60% at 50% 40%,#4a3916,#120d06 75%)'];
function openDetail(id){cur=CARDS[id-1];const o=owned(id);
  $('dStage').innerHTML=cardHTML(cur);$('dBg').style.background=DBG[cur.ri];
  $('dCount').textContent=`×${o.n}`;const d=new Date(o.first);
  $('dFirst').textContent=`初回 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const cd=$('dStage').querySelector('.card');
  const mv=e=>{const r=cd.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;cd.classList.add('tilting');
    cd.style.transform=`rotateY(${(x-.5)*24}deg) rotateX(${(.5-y)*24}deg) scale(1.02)`;cd.style.setProperty('--mx',x*100+'%');cd.style.setProperty('--my',y*100+'%')};
  const lv=()=>{cd.classList.remove('tilting');cd.style.transform=''};
  $('dStage').onpointermove=mv;$('dStage').onpointerdown=mv;$('dStage').onpointerleave=lv;$('dStage').onpointerup=lv;$('dStage').onpointercancel=lv;
  go('detail')}

/* ================= 共有画像 ================= */
function rr(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath()}
let shareBlob=null;
async function makeShare(c){
  const W=720,H=1000,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const bgs=[['#f3f5fa','#dfe3ea'],['#eef3ff','#b9cdf7'],['#fff8e0','#eccb7a'],['#ffe0f0','#d6f6ff'],['#2a2012','#0b0806']][c.ri];
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,bgs[0]);g.addColorStop(1,bgs[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const cw=500,ch=698,cxp=(W-cw)/2,cyp=70;
  x.save();x.shadowColor='rgba(20,25,60,.45)';x.shadowBlur=50;x.shadowOffsetY=24;
  const fr=[['#f7f8fa','#dfe3ea'],['#eef4ff','#a9c1f2'],['#fff7dc','#e8bd5e'],null,['#2d2538','#0e0b14']][c.ri];
  if(fr){g=x.createLinearGradient(cxp,cyp,cxp+cw,cyp+ch);g.addColorStop(0,fr[0]);g.addColorStop(1,fr[1])}
  else{g=x.createLinearGradient(cxp,cyp,cxp+cw,cyp+ch);['#ffd6ec','#d6e2ff','#d2fff1','#fff6c8','#ffd6ec'].forEach((k,i)=>g.addColorStop(i/4,k))}
  rr(x,cxp,cyp,cw,ch,34);x.fillStyle=g;x.fill();x.restore();
  if(c.ri===4){rr(x,cxp+5,cyp+5,cw-10,ch-10,30);x.strokeStyle='#c9a24a';x.lineWidth=8;x.stroke()}
  const tc=c.ri===4?'#f6e3b0':'#1d2335';
  x.fillStyle=tc;x.font='800 34px "M PLUS Rounded 1c",sans-serif';x.textBaseline='middle';x.fillText(c.name,cxp+30,cyp+50,cw-160);
  rr(x,cxp+cw-118,cyp+28,90,44,22);x.fillStyle=c.ri===4?'#e8c46a':'rgba(255,255,255,.8)';x.fill();
  x.fillStyle=['#555','#3f62c4','#a6741a','#c2467e','#2a1d05'][c.ri];x.font='800 26px Outfit,sans-serif';x.textAlign='center';x.fillText(c.rarity,cxp+cw-73,cyp+51);x.textAlign='left';
  let img=new Image(),iw=840,ih=1000,ok=false;
  if(!c.imgBad)await new Promise(r=>{img.onload=()=>{ok=true;r()};img.onerror=r;img.src=c.file});
  if(!ok){img=new Image();const svg=artTpl(c,false).replaceAll('§','sh').replace('<svg ','<svg width="840" height="1000" ');
    await new Promise(r=>{img.onload=r;img.onerror=r;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
  const ax=cxp+28,ay=cyp+92,aw=cw-56,ah=520;x.save();rr(x,ax,ay,aw,ah,22);x.clip();
  const sc=Math.max(aw/iw,ah/ih);x.drawImage(img,ax+(aw-iw*sc)/2,ay+(ah-ih*sc)/2,iw*sc,ih*sc);x.restore();
  x.fillStyle=tc;x.globalAlpha=.75;x.font='700 24px Outfit,sans-serif';x.fillText(c.code,cxp+30,cyp+ch-40);
  x.textAlign='right';x.font='700 24px "M PLUS Rounded 1c",sans-serif';x.fillText(ELEM[c.el].k+'属性',cxp+cw-30,cyp+ch-40);x.globalAlpha=1;
  x.textAlign='center';x.fillStyle=c.ri===4?'#e8c46a':'#1d2335';x.font='800 30px "M PLUS Rounded 1c",sans-serif';x.fillText(`${c.name}　【${RAR[c.ri].label}】`,W/2,cyp+ch+80,W-60);
  x.fillStyle=c.ri===4?'#a8925a':'#7d869c';x.font='700 22px Outfit,sans-serif';x.fillText('PRISMA  CARD COLLECTION',W/2,cyp+ch+130);
  return new Promise(r=>cv.toBlob(b=>{shareBlob=b;r(cv.toDataURL('image/png'))},'image/png'));
}
$('shareBtn').onclick=async()=>{if(!cur)return;AU.play('tap');const url=await makeShare(cur);$('shareImg').src=url;$('shareModal').classList.add('on')};
$('shareNative').onclick=async()=>{AU.play('tap');
  try{const file=new File([shareBlob],`prisma_${cur.no}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:cur.name,text:`${cur.name}【${cur.rarity}】をゲット！ #PRISMAカードコレクション`});return}
    if(navigator.share){await navigator.share({title:cur.name,text:`${cur.name}【${cur.rarity}】をゲット！ #PRISMAカードコレクション`});return}
    throw 0}catch(e){if(e&&e.name==='AbortError')return;toast('この環境では共有できません。画像を長押しして保存してください')}};

/* ================= 設定 ================= */
$('rateT').innerHTML=RAR.map(r=>`<tr><td><b>${r.k}</b>　${r.count}種</td><td>${(r.w/100).toFixed(2)}%</td><td style="color:var(--sub)">1種あたり ${(r.w/100/r.count).toFixed(r.k==='UR'?3:r.k==='SSR'?4:2)}%</td></tr>`).join('');
function syncSet(){$('bgm').value=S.bgm;$('se').value=S.se;$('bgmV').textContent=S.bgm;$('seV').textContent=S.se;
  $('modeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));$('urSw').classList.toggle('on',S.urFast)}
function openSettings(){syncSet();$('setModal').classList.add('on')}
$('bgm').oninput=e=>{S.bgm=+e.target.value;$('bgmV').textContent=S.bgm;AU.vol();save()};
$('se').oninput=e=>{S.se=+e.target.value;$('seV').textContent=S.se;AU.vol();save()};
$('se').onchange=()=>AU.play('reveal',2);
$('modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;save();AU.play('tap');syncSet()};
$('urSw').onclick=()=>{S.urFast=!S.urFast;save();AU.play('tap');syncSet()};
function ask(t,p,yes){return new Promise(r=>{$('dlgT').textContent=t;$('dlgP').textContent=p;$('dlgYes').textContent=yes;$('dlg').classList.add('on');
  $('dlgYes').onclick=()=>{$('dlg').classList.remove('on');r(true)};$('dlgNo').onclick=()=>{$('dlg').classList.remove('on');r(false)}})}
/* ---- データ移行 ---- */
const MV='PRISMA1.';
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function zip(u8,mode){if(typeof CompressionStream==='undefined')return null;const st=new Blob([u8]).stream().pipeThrough(mode==='c'?new CompressionStream('deflate-raw'):new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
const sum=t=>{let h=7;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36).slice(-4).padStart(4,'0')};
async function makeCode(){
  const cards=Object.entries(S.cards).map(([id,o])=>[+id,o.n,Math.floor(o.first/1000)]);
  const json=JSON.stringify({v:1,c:cards,tc:S.totalCards,tp:S.totalPacks,at:Math.floor(Date.now()/1000)});
  const raw=new TextEncoder().encode(json);let z=null;try{z=await zip(raw,'c')}catch(e){}
  const body=(z?'z':'j')+b64e(z||raw);return MV+body+'.'+sum(body)}
async function readCode(t){
  t=(t||'').replace(/\s+/g,'');if(!t.startsWith(MV))throw '引き継ぎコードの形式が正しくありません';
  const rest=t.slice(MV.length),dot=rest.lastIndexOf('.');if(dot<0)throw 'コードが途中で切れています';
  const body=rest.slice(0,dot);if(sum(body)!==rest.slice(dot+1))throw 'コードが途中で切れているか、文字が違っています';
  let u8;try{u8=b64d(body.slice(1));if(body[0]==='z'){u8=await zip(u8,'d');if(!u8)throw 0}}catch(e){throw 'このブラウザではコードを読み込めませんでした'}
  const d=JSON.parse(new TextDecoder().decode(u8));if(!d||d.v!==1||!Array.isArray(d.c))throw '対応していないデータです';
  const cards={};for(const[id,n,f]of d.c){if(!(id>=1&&id<=CARDS.length)||!(n>=1))throw 'データの中身が正しくありません';cards[id]={n:Math.floor(n),first:f*1000}}
  return {cards,totalCards:Math.max(0,d.tc|0),totalPacks:Math.max(0,d.tp|0),at:d.at}}
$('moveBtn').onclick=async()=>{AU.play('tap');$('inCode').value='';$('inErr').textContent='';$('outCode').value='作成中…';$('moveModal').classList.add('on');
  const code=await makeCode();$('outCode').value=code;
  $('outInfo').textContent=`図鑑 ${ownedTotal()} / ${CARDS.length} 種・累計 ${S.totalPacks.toLocaleString()} 回開封のデータです（${code.length}文字）。`};
$('copyCode').onclick=async e=>{AU.play('tap');const b=e.currentTarget,t=$('outCode').value;
  try{await navigator.clipboard.writeText(t);b.textContent='コピーしました'}catch(_){const a=$('outCode');a.focus();a.select();try{document.execCommand('copy');b.textContent='コピーしました'}catch(__){b.textContent='選択しました。長押しでコピーしてください'}}
  setTimeout(()=>b.textContent='引き継ぎコードをコピー',2200)};
$('loadCode').onclick=async()=>{AU.play('tap');$('inErr').textContent='';let d;
  try{d=await readCode($('inCode').value)}catch(e){$('inErr').textContent=typeof e==='string'?e:'コードを読み込めませんでした';return}
  const n=Object.keys(d.cards).length,when=d.at?new Date(d.at*1000):null;
  if(!await ask('このデータで復元しますか？',`図鑑 ${n} 種・累計 ${d.totalPacks} 回開封のデータです${when?`（${when.getMonth()+1}/${when.getDate()} ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')} 発行）`:''}。この端末の ${ownedTotal()} 種のデータは上書きされ、元に戻せません。`,'復元する'))return;
  S.cards=d.cards;S.totalCards=d.totalCards;S.totalPacks=d.totalPacks;save();
  $('moveModal').classList.remove('on');$('setModal').classList.remove('on');toast('データを復元しました')};

$('resetBtn').onclick=async()=>{AU.play('tap');
  if(!await ask('データを初期化しますか？','カードの所持情報・開封記録など、すべてのゲームデータが消去されます。','次へ'))return;
  if(!await ask('本当に初期化しますか？',`所持中の ${ownedTotal()} 種のカードと ${S.totalPacks} 回分の開封記録は元に戻せません。`,'初期化する'))return;
  const keep={bgm:S.bgm,se:S.se};S=DEF();S.bgm=keep.bgm;S.se=keep.se;
  try{localStorage.removeItem(KEY)}catch(e){}save();syncSet();toast('データを初期化しました')};

window.__prisma={drawOne,RAR,CARDS,artTpl,ELEM,CRE};
}
